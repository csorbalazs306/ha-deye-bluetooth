name: Bug report
description: Something does not work or a value looks wrong
body:
  - type: input
    id: inverter
    attributes:
      label: Inverter model
      placeholder: SUN-15K-SG05LP3-EU-SM2
    validations:
      required: true
  - type: input
    id: logger
    attributes:
      label: Logger firmware
      placeholder: DYDA_WiBLE_1.6.2
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Device page → ⋮ → Download diagnostics, then attach the file. The serial number and Bluetooth address are removed from it.
